<!-- produto.html -->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produto - Dark Store</title> 
   <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #f0f0f0;
      --accent: #bb86fc;
      --accent-hover: #9a67ea;
    }
    button{
      cursor: pointer;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 1rem;
    }

    .produto {
      max-width: 600px;
      margin: auto;
      background-color: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
      padding: 1rem;
      cursor: pointer;
    }

    .produto img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 1rem;
    }

    button {
      background-color: var(--accent);
      color: #fff;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }
  </style>
</head>

<body>
  <button onclick="location.href='carrinho.html'" style="position:fixed;background:none;border:none;color:#bb86fc;cursor:pointer;right: -3px;font-size: x-large;top: 5px;">🛒</button>

  <div class="produto">
    <br><br>
    <button onclick="window.history.back()" style="width:100%;margin-bottom: 5px;">Voltar</button>

    <img id="imgProduto" src="" alt="Produto">
    <h1 id="nomeProduto"></h1>
    <p id="descProduto"></p>
    <p id="precoProduto"></p>
    <button onclick="adicionarCarrinho()">Adicionar ao carrinho</button>
  </div>

  <script src="itens.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const id = parseInt(urlParams.get('id'));



    const produto = PRODUCTS.find(p => p.id === id);

    if (produto) {
      document.getElementById('imgProduto').src = produto.imagem;
      document.getElementById('nomeProduto').textContent = produto.nome;
      document.getElementById('descProduto').textContent = produto.desc;
      document.getElementById('precoProduto').textContent = 'R$ ' + produto.preco.toFixed(2);
    } else {
      document.body.innerHTML = '<h2>Produto não encontrado.</h2>';
    }

    function adicionarCarrinho() {
      let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
      carrinho.push(produto);
      localStorage.setItem('carrinho', JSON.stringify(carrinho));
      alert('Produto adicionado ao carrinho!');
    }
  </script>
</body>

</html>
